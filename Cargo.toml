[package]
name = "brok-shard-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Template for building Brokspace shards: reports TODO/FIXME/HACK markers in changed files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brokspace/brok-shard-template"
readme = "README.md"
keywords = ["brokspace", "shard", "template"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
brok-sdk = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
