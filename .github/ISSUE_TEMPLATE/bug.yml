name: Bug
description: The template does not build, or a step in its README does not work.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a starting point for your own shard. Bugs in your shard's logic belong in your repository; bugs in the runtime belong in [brokspace/brok](https://github.com/brokspace/brok/issues).
  - type: input
    id: step
    attributes:
      label: README step
      description: Which step of the "build your own shard" guide failed?
      placeholder: "Step 4: brok shard install ./my-shard"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `brok doctor` and `rustc --version`
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
