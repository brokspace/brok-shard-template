name: Promote

# Promotes staging to main.
# See brokspace/.github, "Zero-touch releases".
on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  promote:
    uses: brokspace/.github/.github/workflows/promote.yml@main
    with:
      release: false
    secrets: inherit
